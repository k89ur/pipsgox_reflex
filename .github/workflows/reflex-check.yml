name: Reflex check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -c "import app; print('Reflex app import: OK')"
      - run: reflex --version
      - name: Reflex server smoke test
        shell: bash
        run: |
          set -e
          reflex run --env prod > /tmp/reflex.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ > /tmp/reflex-home.html; then
              echo 'Reflex frontend smoke test: OK'
              exit 0
            fi
            if ! kill -0 $PID 2>/dev/null; then
              cat /tmp/reflex.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/reflex.log
          exit 1
