name: Validate Reflex app

on: [push]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Import app
        run: python -c "import app; print('Reflex app import: OK')"
      - name: Reflex CLI
        run: reflex --version
      - name: Build check
        run: reflex export --help
