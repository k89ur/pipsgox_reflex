name: Reflex check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Install, import, and compile Reflex app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q .

      - name: Import Reflex app
        run: python -c "import app; print('Reflex app import: OK')"

      - name: Check Reflex CLI
        run: reflex --version

      - name: Check Reflex app build
        run: reflex export --help
